services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: eaap
      POSTGRES_USER: eaap
      POSTGRES_PASSWORD: eaap_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaap -d eaap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

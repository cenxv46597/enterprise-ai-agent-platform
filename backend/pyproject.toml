[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-platform-backend"
version = "0.1.0"
description = "Backend for the Enterprise AI Agent Platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20,<2",
  "fastapi>=0.142,<1",
  "httpx>=0.28.1,<0.29",
  "pgvector>=0.4.2,<0.5",
  "pydantic-settings>=2.15,<3",
  "psycopg[binary]>=3.3.6,<4",
  "python-multipart>=0.0.32,<0.1",
  "SQLAlchemy>=2.0.54,<2.1",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-platform-backend"
version = "0.1.0"
description = "Backend for the Enterprise AI Agent Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142,<1",
  "pydantic-settings>=2.15,<3",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

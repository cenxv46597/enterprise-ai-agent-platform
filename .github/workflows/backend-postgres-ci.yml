name: Backend PostgreSQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL listing, readiness and auth upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: python
        working-directory: backend
    env:
      CI: 'true'
      PIP_CONFIG_FILE: /dev/null
    services:
      postgres:
        # Match the local baseline; vector supports the fixed 0009 -> 0010 migration check.
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: eaap_test
          POSTGRES_USER: eaap_ci_admin
          POSTGRES_PASSWORD: ci-only-disposable-service
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U eaap_ci_admin -d eaap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install constrained backend dependencies
        run: |
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "-I", "-m", "pip", "install",
              "--disable-pip-version-check", "--no-input", "--no-cache-dir",
              "--index-url", "https://pypi.org/simple",
              "--constraint", "constraints-postgres-ci.txt", ".[dev]",
          ], check=True)
      - name: Check installed dependencies
        run: |
          import subprocess
          import sys

          subprocess.run([sys.executable, "-I", "-m", "pip", "check"], check=True)
      - name: Check PostgreSQL test entry safety
        run: |
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "-I", "scripts/run_postgres_tests.py", "--check-entry",
          ], check=True)
      - name: Run fixed isolated PostgreSQL checks
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          POSTGRES_SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          import os
          import subprocess
          import sys

          subprocess.run([
              sys.executable, "-I", "scripts/run_postgres_tests.py",
              "--ci-container", os.environ["POSTGRES_SERVICE_ID"],
              "--port", os.environ["POSTGRES_SERVICE_PORT"],
          ], check=True)

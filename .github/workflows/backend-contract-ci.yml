name: Backend contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Isolated backend contracts
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
        working-directory: backend
    env:
      CI: 'true'
      PIP_CONFIG_FILE: NUL
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install constrained backend dependencies
        run: python -I -m pip install --disable-pip-version-check --no-input --no-cache-dir --index-url https://pypi.org/simple --constraint constraints-ci.txt .[dev]
      - name: Check installed dependencies
        run: python -I -m pip check
      - name: Run isolated contract suite
        run: python -I scripts/run_contract_tests.py
